server {
  listen 80;
  server_name _;

  # Serve /blog (without trailing slash)
  location = /blog {
    alias /usr/share/nginx/html/index.html;
    default_type text/html;
  }

  # Serve from /blog path
  location /blog/ {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /blog/index.html;
  }

  location / {
    return 404;
  }
}
